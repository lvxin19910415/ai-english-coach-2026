<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>🤖 AI英语教练</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}.hero,.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.hero{background:#111827;color:white}.title{font-size:28px;font-weight:800}.small{font-size:13px;color:#6b7280}.hero .small{color:#cbd5e1}.phrase{font-size:27px;font-weight:800;margin:12px 0 5px}.meaning{color:#4b5563}.btn{width:100%;padding:13px;margin-top:10px;border:0;border-radius:14px;font-weight:700;background:#111827;color:white}.word{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.option{text-align:left;background:#eef2f7;color:#111827}.ok{background:#dcfce7!important}.bad{background:#fee2e2!important}.bar{height:9px;background:#111827;border-radius:9px;width:0}.track{height:9px;background:#e5e7eb;border-radius:9px}.example{padding:9px 0}textarea{width:100%;min-height:75px;border:1px solid #ddd;border-radius:12px;padding:10px;font-size:15px}</style></head><body><div class="wrap">
<div class="hero"><div class="small">每天 5 分钟 · 循序渐进</div><div class="title">🤖 AI 英语教练</div><div id="date"></div><p>🔥 连续学习 <b id="streak">0</b> 天　·　累计 <b id="done">0</b> 课</p></div>
<div class="card"><b id="level"></b><div class="phrase" id="phrase"></div><div class="meaning" id="meaning"></div><button class="btn" onclick="speak()">🔊 听发音</button><button class="btn" onclick="slow()">🐢 慢速播放</button></div>
<div class="card"><b>📚 今日 5 个高频词</b><div id="words"></div></div>
<div class="card"><b>💬 实用例句</b><div id="examples"></div></div>
<div class="card"><b>🎤 口语练习</b><p>听一句，然后大声跟读：</p><button class="btn" onclick="speak(ex[0],.8)">🔊 播放跟读句</button><textarea placeholder="写下你想说的英文……"></textarea></div>
<div class="card"><b>🧠 今日小测</b><p id="q"></p><div id="opts"></div><p id="result"></p></div>
<div class="card"><b>📈 学习进度</b><div class="track"><div class="bar" id="bar"></div></div><p class="small">完成小测后自动记录今天</p></div>
</div><script>
const lessons=[
["基础·第1课","I'm getting used to it.","我正在慢慢习惯它。",[["get used to","习惯于"],["routine","日常习惯"],["comfortable","自在的"],["practice","练习"],["improve","提高"]],["I'm getting used to my new job.","It takes time to get used to speaking English."],"“我正在慢慢习惯它。”怎么说？",["I'm getting used to it.","I get used it.","I'm used get to it."]],
["基础·第2课","Could you say that again?","你可以再说一遍吗？",[["again","再次"],["slowly","慢慢地"],["understand","理解"],["mean","意思是"],["repeat","重复"]],["Could you say that again, please?","Could you speak more slowly?"],"听不清时，哪句话最实用？",["Could you say that again?","Could you eat again?","Could you go that?"]],
["基础·第3课","That sounds great.","听起来很棒。",[["sound","听起来"],["great","很棒"],["idea","想法"],["plan","计划"],["perfect","完美"]],["That sounds great!","Your plan sounds great to me."],"“听起来很棒。”怎么说？",["That sounds great.","That hears good.","That great sounds."]]
];
const d=Math.floor((new Date()-new Date("2026-01-01"))/86400000), L=lessons[Math.abs(d)%lessons.length], ex=L[4], key="aienglish2";
let s=JSON.parse(localStorage.getItem(key)||'{"done":0,"streak":0,"last":""}'),today=new Date().toISOString().slice(0,10);
document.getElementById("date").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
document.getElementById("level").textContent=L[0];document.getElementById("phrase").textContent=L[1];document.getElementById("meaning").textContent=L[2];
document.getElementById("streak").textContent=s.streak;document.getElementById("done").textContent=s.done;
document.getElementById("words").innerHTML=L[3].map(x=>`<div class="word"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
document.getElementById("examples").innerHTML=ex.map((x,i)=>`<div class="example"><b>${i+1}. ${x}</b></div>`).join("");
document.getElementById("q").textContent=L[5];document.getElementById("opts").innerHTML=L[6].map((x,i)=>`<button class="btn option" onclick="ans(${i},this)">${x}</button>`).join("");
function speak(t=L[1],r=.9){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;speechSynthesis.speak(u)}
function slow(){speak(L[1],.65)}
function ans(i,b){document.querySelectorAll(".option").forEach(x=>x.disabled=true);if(i===0){b.classList.add("ok");document.getElementById("result").textContent="✅ 答对了！今天课程完成。";if(s.last!==today){let y=new Date();y.setDate(y.getDate()-1);s.streak=s.last===y.toISOString().slice(0,10)?s.streak+1:1;s.last=today;s.done++;localStorage.setItem(key,JSON.stringify(s));document.getElementById("streak").textContent=s.streak;document.getElementById("done").textContent=s.done;document.getElementById("bar").style.width=((s.done%10)||10)*10+"%"}}else{b.classList.add("bad");document.getElementById("result").textContent="❌ 再想想，正确答案是第一项。"}}
document.getElementById("bar").style.width=((s.done%10)||10)*10+"%";
</script><script>navigator.serviceWorker&&navigator.serviceWorker.register("sw.js")</script></body></html>
